<!-- The seating widget; expects in `.`: domId, scheme (an object or null), names[] (name, colour), legend[], rows[], footnote; in the page root: isStaff. The guest sees, in one card, the scheme and under it who sits at the record's seats: a label per seat with the name, in the seat's colour on the scheme, in seat order; no seat number. The staff page shows the legend above the card, and in it the scheme, the seat table and the footnote. The scheme partial gets the scheme object as `.`; without one the card has no drawing. -->
<div class="widget seating-widget seating" id="{{.domId}}"><!-- if:!isStaff -->
  <div class="card seating__card">
    <!-- with:.scheme --><!-- include:partials/scheme --><!-- endwith -->
    <p class="seating__meta"><!-- each:.names --> <span class="time-label time-label--strong seating__name seating__name--colour-{{.colour}}">{{.name}}</span><!-- endeach --></p>
  </div><!-- endif --><!-- if:isStaff -->
  <!-- include:partials/legend -->
  <div class="card seating__card">
    <!-- with:.scheme --><!-- include:partials/scheme --><!-- endwith -->
    <!-- include:partials/seat-table --><!-- if:.footnote -->
    <p class="note-line seating__footnote">{{.footnote}}</p><!-- endif -->
  </div><!-- endif -->
</div>
