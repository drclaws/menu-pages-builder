<!-- The legend of dietary needs on the staff page; expects in `.`: the seating widget - legend[] (letter, label). A list of the needs at the table: the letter in its orange circle repeats the scheme's badges and is hidden from screen readers; the label is the text. -->
<!-- if:.legend -->
<ul class="legend" role="list">
  <!-- each:.legend -->
  <li class="legend__item"><span class="legend__mark" aria-hidden="true">{{.letter}}</span><span class="legend__label">{{.label}}</span></li>
  <!-- endeach -->
</ul>
<!-- endif -->
