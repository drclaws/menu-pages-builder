<!-- The navigation bar at the top of the page; expects in the page root: nav[] (label, target - the domId of a section of the page), strings.sections. The template includes it only when nav is not empty. One link per section, in page order: a plain link to a part of the page; nothing is hidden or switched. The hooks of the script's sectionNav module: data-section-nav on the bar, data-section-nav-list on the list (it scrolls sideways when the links do not fit) and data-section-nav-link on every link; with the script, the link of the section in view carries aria-current. The style sheet keeps the bar at the top of the screen and leaves it out of print. The landmark's label is a word of the page (strings.sections); the link labels come from the data. -->
<nav class="section-nav" aria-label="{{strings.sections}}" data-section-nav>
  <div class="container section-nav__inner">
    <ul class="section-nav__list" role="list" data-section-nav-list><!-- each:nav -->
      <li class="section-nav__item"><a class="section-nav__link" href="#{{.target}}" data-section-nav-link>{{.label}}</a></li><!-- endeach -->
    </ul>
  </div>
</nav>
